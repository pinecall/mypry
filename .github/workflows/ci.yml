name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  # Fast gate: build + serializer + bounded-state + tool-shape tests. No browser.
  unit:
    name: unit (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  # debugger_inject path (findPidByPort → _debugProcess → connect) + serializer.
  inject:
    name: inject e2e
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y lsof
      - run: npm ci
      - run: npm run test:inject

  # Browser-facing tools: connect+frontend, snapshot, browse → backend pause.
  fullstack:
    name: fullstack (browser)
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:fullstack

  # Source-map + breakpoint resolution against a real Next.js app (both bundlers).
  nextjs:
    name: next.js (webpack + turbopack)
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: install Next.js fixture deps
        run: cd tests/fixtures/cart-bug && npm ci
      - name: webpack breakpoints
        run: node --test tests/integration/webpack-breakpoints.test.mjs
      - name: turbopack breakpoints
        run: node --test tests/integration/turbopack-breakpoints.test.mjs
